[project]
name = "midichlorian"
version = "0.1.0"
description = "Playbook-run coordinator for the home servers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2",
    "httpx>=0.27",
    "mcp[cli]<2",
]

[project.scripts]
midichlorian-server = "midichlorian.api:main"
midichlorian-mcp = "midichlorian.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midichlorian"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# fastapi's TestClient still wraps httpx; nothing here to act on until fastapi moves
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
