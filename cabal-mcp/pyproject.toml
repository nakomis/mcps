[project]
name = "cabal-mcp"
version = "0.1.0"
description = "Convene a cabal of LLMs — fan a single prompt out to Bedrock, Azure Foundry, and Google AI Studio, compile the results"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "boto3>=1.34.0",
    "azure-ai-inference>=1.0.0b9",
    "azure-core>=1.30.0",
    "google-genai>=0.3.0",
    "anyio>=4.3.0",
]

[project.scripts]
cabal-mcp = "cabal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cabal"]
