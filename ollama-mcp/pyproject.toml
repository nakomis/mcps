[project]
name = "ollama-mcp"
version = "0.1.0"
description = "MCP server for Ollama — embeddings and local LLM generation"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ollama-mcp = "ollama_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
