[project]
name = "taiga-mcp"
version = "0.1.0"
description = "MCP server for reading and writing a self-hosted Taiga instance"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
taiga-mcp = "taiga_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
