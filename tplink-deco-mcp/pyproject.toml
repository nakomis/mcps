[project]
name = "tplink-deco-mcp"
version = "0.1.0"
description = "MCP server for managing a TP-Link Deco mesh network"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pycryptodome>=3.20.0",
    "cryptography>=41.0.0",
]

[project.scripts]
tplink-deco-mcp = "tplink_deco_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
