name: ScreenEyeMac
options:
  bundleIdPrefix: com.nakomis
  deploymentTarget:
    macOS: "15.0"
targets:
  ScreenEyeMac:
    type: application
    platform: macOS
    sources:
      - ScreenEyeMac
      # Pure zoom arithmetic, shared with the phone app so the steps and slider match.
      - path: ../ios/ScreenEye/Zoom.swift
        group: Shared
    settings:
      base:
        PRODUCT_NAME: ScreenEye
        PRODUCT_BUNDLE_IDENTIFIER: com.nakomis.screeneye.mac
        DEVELOPMENT_TEAM: 62YFUFBSFX
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenEye
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ScreenEye shows the camera of the phone running ScreenEye on your local network, and takes pictures from it."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    info:
      path: ScreenEyeMac/Info.plist
      properties:
        CFBundleDisplayName: ScreenEye
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices: ["_screeneye._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "ScreenEye shows the camera of the phone running ScreenEye on your local network, and takes pictures from it."
  ScreenEyeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ScreenEyeMacTests]
    dependencies:
      - target: ScreenEyeMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 62YFUFBSFX
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScreenEye.app/Contents/MacOS/ScreenEye"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ScreenEyeMac:
    build:
      targets:
        ScreenEyeMac: all
    test:
      targets: [ScreenEyeMacTests]
