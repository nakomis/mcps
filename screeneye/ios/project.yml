name: ScreenEye
options:
  bundleIdPrefix: com.nakomis
  deploymentTarget:
    iOS: "18.0"
targets:
  ScreenEye:
    type: application
    platform: iOS
    sources: [ScreenEye]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakomis.screeneye
        DEVELOPMENT_TEAM: 62YFUFBSFX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ScreenEye points the camera at a screen so Claude can read it."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ScreenEye serves camera snapshots to your Mac on the local network, and saves frames to it."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    info:
      path: ScreenEye/Info.plist
      properties:
        NSBonjourServices: ["_screeneye._tcp", "_screeneye-host._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "ScreenEye points the camera at a screen so Claude can read it."
        NSLocalNetworkUsageDescription: "ScreenEye serves camera snapshots to your Mac on the local network, and saves frames to it."
        UILaunchScreen: {}
  ScreenEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScreenEyeTests]
    dependencies:
      - target: ScreenEye
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 62YFUFBSFX
        SWIFT_VERSION: "6.0"
schemes:
  ScreenEye:
    build:
      targets:
        ScreenEye: all
    test:
      targets: [ScreenEyeTests]
