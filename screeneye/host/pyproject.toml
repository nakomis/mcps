[project]
name = "screeneye-host"
version = "0.1.0"
description = "ScreenEye host: receives frames pushed from the ScreenEye app and files them on a share"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "pillow>=10.0.0",
]

[project.scripts]
screeneye-host = "screeneye_host.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
