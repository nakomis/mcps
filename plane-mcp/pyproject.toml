[project]
name = "plane-mcp"
version = "0.1.0"
description = "MCP server for reading and writing the self-hosted Plane instance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "markdown>=3.10",
    "markdownify>=1.2",
    "boto3>=1.35",
]

[project.scripts]
plane-mcp = "plane_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
